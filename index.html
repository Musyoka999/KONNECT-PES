<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vee Pro - Hybrid Satellite</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --primary: #007bff; --danger: #dc3545; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #000; color: #fff; }
        #map { height: 100vh; width: 100%; z-index: 1; }

        .modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 2000; background: white; padding: 25px; border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5); width: 85%; max-width: 320px; color: #333;
        }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-main { background: var(--primary); color: white; margin-top: 10px; }
        .btn-panic { background: var(--danger); color: white; margin-top: 10px; }

        #ui-overlay {
            position: absolute; top: 15px; left: 15px; z-index: 1000;
            background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(8px); padding: 15px; 
            border-radius: 12px; display: none; border: 1px solid #444;
        }

        .name-label {
            background: rgba(0, 123, 255, 0.9); color: white; border: 1px solid white;
            padding: 2px 8px; border-radius: 10px; font-weight: bold; font-size: 11px;
            white-space: nowrap; box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div id="login-screen" class="modal">
        <h2 style="text-align:center; margin-top:0;">Vee Pro</h2>
        <input type="text" id="roomInput" placeholder="Room Name">
        <input type="password" id="passInput" placeholder="Password">
        <input type="text" id="nameInput" placeholder="Your Name">
        <button class="btn-main" onclick="startVee()">Connect to Satellites</button>
    </div>

    <div id="ui-overlay">
        <div><b>Room:</b> <span id="room-display" style="color: #007bff;"></span></div>
        <div id="active-count" style="font-size: 0.8em; margin: 5px 0;">Tracking: 1 person</div>
        <button class="btn-panic" onclick="panicStop()">PANIC: WIPE & EXIT</button>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // !!! PASTE YOUR FIREBASE URL HERE !!!
        const firebaseConfig = { databaseURL: "https://vee-tracker-47c73-default-rtdb.firebaseio.com/" };
        
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let map, watchId, myName, secretPath;
        let markers = {};
        let labels = {};

        // 1. Initialize Map
        map = L.map('map', { maxZoom: 20, zoomControl: false }).setView([0, 0], 2);
        
        // 2. Add THE SATELLITE IMAGE
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 20
        }).addTo(map);

        // 3. Add THE NAMES OF PLACES (Hybrid Overlay)
        // This adds street names, building names, and landmarks on top of the satellite
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png', {
            maxZoom: 20,
            opacity: 1.0,
            pane: 'markerPane' // This ensures names stay on top of the ground imagery
        }).addTo(map);

        window.startVee = function() {
            const room = document.getElementById('roomInput').value;
            const pass = document.getElementById('passInput').value;
            myName = document.getElementById('nameInput').value || "User";

            if(!room || !pass) return alert("Enter Room and Password!");

            secretPath = `rooms/${room}_${pass}`;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('ui-overlay').style.display = 'block';
            document.getElementById('room-display').innerText = room;

            if ("geolocation" in navigator) {
                watchId = navigator.geolocation.watchPosition((pos) => {
                    const { latitude, longitude } = pos.coords;
                    set(ref(db, `${secretPath}/${myName}`), {
                        lat: latitude,
                        lng: longitude,
                        time: Date.now()
                    });
                    if (!markers[myName]) map.flyTo([latitude, longitude], 19);
                }, null, { enableHighAccuracy: true });
            }

            onValue(ref(db, secretPath), (snapshot) => {
                const data = snapshot.val();
                if (!data) return;
                
                document.getElementById('active-count').innerText = `Tracking: ${Object.keys(data).length} people`;

                for (let id in data) {
                    const { lat, lng, time } = data[id];
                    const statusText = Math.floor((Date.now() - time) / 1000) < 10 ? "Live" : "Offline";

                    if (markers[id]) {
                        markers[id].setLatLng([lat, lng]);
                        labels[id].setLatLng([lat, lng]);
                        markers[id].getPopup().setContent(`<b>${id}</b> (${statusText})`);
                    } else {
                        // Floating Name Tag
                        const nameTag = L.divIcon({
                            className: 'custom-label',
                            html: `<div class="name-label">${id}</div>`,
                            iconSize: [60, 20],
                            iconAnchor: [30, 35]
                        });
                        labels[id] = L.marker([lat, lng], {icon: nameTag}).addTo(map);

                        // Blue/Red Tracking Dot
                        const dotIcon = L.divIcon({
                            className: 'dot',
                            html: `<div style="background:${id === myName ? '#007bff' : '#ff4500'}; width:12px; height:12px; border:2px solid #fff; border-radius:50%; box-shadow: 0 0 10px #000;"></div>`,
                            iconSize: [12, 12],
                            iconAnchor: [6, 6]
                        });

                        markers[id] = L.marker([lat, lng], {icon: dotIcon}).addTo(map)
                            .bindPopup(`<b>${id}</b> (${statusText})`).openPopup();
                    }
                }
            });
        };

        window.panicStop = function() {
            if (watchId) navigator.geolocation.clearWatch(watchId);
            remove(ref(db, `${secretPath}/${myName}`)).then(() => location.reload());
        };
    </script>
</body>
</html>
