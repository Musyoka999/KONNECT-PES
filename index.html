<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vee Pro</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #000; color: white; overflow: hidden; font-family: sans-serif; }
        #map { height: 100vh; width: 100vw; background: #111; position: absolute; top: 0; left: 0; }

        .modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 9999; background: white; padding: 30px; border-radius: 20px;
            width: 280px; text-align: center; color: #333; box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        .btn-go { background: #000; color: white; padding: 15px; width: 100%; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        
        #ui-overlay {
            position: absolute; top: 20px; left: 20px; z-index: 5000;
            background: rgba(0,0,0,0.8); padding: 15px; border-radius: 15px; display: none; border: 1px solid #444;
        }
        .name-tag { background: #000; color: #fff; padding: 3px 10px; border-radius: 5px; font-size: 11px; border: 1px solid #fff; }
    </style>
</head>
<body>

    <div id="login-screen" class="modal">
        <h2 style="margin:0 0 10px 0;">VEE PRO</h2>
        <input type="text" id="roomInput" placeholder="Room Name">
        <input type="password" id="passInput" placeholder="Password">
        <input type="text" id="nameInput" placeholder="Your Name">
        <button class="btn-go" onclick="startVee()">START TRACKING</button>
    </div>

    <div id="ui-overlay">
        <div id="room-display" style="font-weight:bold; color:#007bff;"></div>
        <button onclick="panicStop()" style="background:#ff3b30; color:white; border:none; padding:8px; border-radius:5px; margin-top:10px; width:100%; cursor:pointer;">PANIC & WIPE</button>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // !!! VINCENTS FIREBASE URL !!!
        const firebaseConfig = { 
            databaseURL: "https://vee-tracker-47c73-default-rtdb.firebaseio.com/" 
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let map, watchId, myName, secretPath;
        let markers = {};
        let tags = {};

        // 1. Load the Map FIRST so the screen isn't blank
        try {
            map = L.map('map', { maxZoom: 21, zoomControl: false }).setView([0, 0], 2);
            L.tileLayer('https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {
                maxZoom: 21, subdomains:['mt0','mt1','mt2','mt3']
            }).addTo(map);
            console.log("Map Loaded");
        } catch (e) {
            alert("Map Error: Check your internet connection.");
        }

        window.startVee = function() {
            const room = document.getElementById('roomInput').value;
            const pass = document.getElementById('passInput').value;
            myName = document.getElementById('nameInput').value || "User";

            if(!room || !pass) { alert("Enter Room & Pass!"); return; }

            secretPath = `rooms/${room}_${pass}`;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('ui-overlay').style.display = 'block';
            document.getElementById('room-display').innerText = "ROOM: " + room.toUpperCase();

            // 2. Start GPS
            if (navigator.geolocation) {
                watchId = navigator.geolocation.watchPosition((pos) => {
                    const { latitude, longitude } = pos.coords;
                    set(ref(db, `${secretPath}/${myName}`), { 
                        lat: latitude, 
                        lng: longitude, 
                        time: Date.now() 
                    });
                    if (!markers[myName]) map.flyTo([latitude, longitude], 19);
                }, (err) => {
                    alert("GPS Blocked! You must use HTTPS or click 'Allow Location'.");
                }, { enableHighAccuracy: true });
            }

            // 3. Start Syncing
            onValue(ref(db, secretPath), (snapshot) => {
                const data = snapshot.val();
                if (!data) return;
                for (let id in data) {
                    const { lat, lng } = data[id];
                    const isMe = (id === myName);
                    const color = isMe ? '#ff3b30' : '#007aff'; // RED ME, BLUE THEM

                    if (markers[id]) {
                        markers[id].setLatLng([lat, lng]);
                        tags[id].setLatLng([lat, lng]);
                    } else {
                        // Create Name Tag
                        const tagIcon = L.divIcon({ 
                            className: 'tag', 
                            html: `<div class="name-tag">${id}</div>`, 
                            iconSize: [60, 20], 
                            iconAnchor: [30, 42] 
                        });
                        tags[id] = L.marker([lat, lng], {icon: tagIcon}).addTo(map);

                        // Create Precision Dot
                        const dotIcon = L.divIcon({ 
                            className: 'dot', 
                            html: `<div style="background:${color}; width:16px; height:16px; border:3px solid #fff; border-radius:50%; box-shadow: 0 0 15px #000;"></div>`, 
                            iconSize: [16, 16], 
                            iconAnchor: [8, 8] 
                        });
                        markers[id] = L.marker([lat, lng], {icon: dotIcon}).addTo(map);
                    }
                }
            });
        };

        window.panicStop = function() {
            if (watchId) navigator.geolocation.clearWatch(watchId);
            remove(ref(db, `${secretPath}/${myName}`)).then(() => {
                location.reload();
            });
        };
    </script>
</body>
</html>
